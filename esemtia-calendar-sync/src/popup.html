<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>esemtia → Calendar</title>
<style>
  :root{ color-scheme: light dark; }
  *{box-sizing:border-box}
  body{margin:0;width:420px;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#fcfcfb;color:#0b0b0b}
  @media (prefers-color-scheme: dark){ body{background:#1a1a19;color:#fff} }
  .wrap{padding:14px;max-height:600px;overflow-y:auto}
  h1{font-size:14px;margin:0 0 10px}
  textarea{width:100%;min-height:70px;font:inherit;padding:8px;border-radius:8px;
    border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#77756f;flex:1;min-width:110px}
  input[type=text],input[type=date],input[type=time],select{
    font:inherit;padding:6px 8px;border-radius:7px;border:1px solid rgba(127,127,127,.35);
    background:transparent;color:inherit}
  label.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:#77756f;white-space:nowrap}
  button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid rgba(127,127,127,.35);
    background:transparent;color:inherit;cursor:pointer}
  button.primary{background:#2a78d6;border-color:transparent;color:#fff;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:default}
  button.small{padding:4px 9px;font-size:12px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(127,127,127,.15);margin-right:6px}
  .info{margin-top:10px;padding:9px 11px;border-radius:8px;background:rgba(127,127,127,.09);font-size:12px}
  .warn{border-left:3px solid #eda100}
  .ok{border-left:3px solid #1baf7a}
  .err{border-left:3px solid #d9534f}
  .child{font-weight:600;margin-top:8px}
  .events{margin-top:10px;display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid rgba(127,127,127,.3);border-radius:10px;padding:10px}
  .cardhead{display:flex;align-items:flex-start;gap:8px}
  .cardhead label.chk{flex:1;font-size:13px;color:inherit;font-weight:600}
  .quote{font-size:11.5px;color:#77756f;font-style:italic;margin:4px 0 8px;padding-left:2px;
    border-left:2px solid rgba(127,127,127,.3);padding-left:8px}
  .recent{margin-top:14px;border-top:1px solid rgba(127,127,127,.25);padding-top:10px}
  .recent h2{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#77756f;margin:0 0 6px}
  .recent ul{list-style:none;padding:0;margin:0;max-height:110px;overflow:auto}
  .recent li{padding:4px 0;font-size:12px;display:flex;justify-content:space-between;gap:6px}
  .recent a{color:inherit}
  a.optlink{font-size:11px;color:#2a78d6;text-decoration:none}
  .hidden{display:none!important}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(127,127,127,.35);
    border-top-color:#2a78d6;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 esemtia → Google Calendar</h1>

  <textarea id="text" placeholder="Pega aquí el texto del correo de esemtia Connect (o selecciónalo en la página y usa el botón flotante)."></textarea>
  <div class="row">
    <button class="primary" id="analyze">Analizar</button>
    <span class="fld" style="flex:2">Calendario
      <select id="calendar"><option value="primary">Mi calendario principal</option></select>
    </span>
  </div>

  <div id="status" class="info hidden"></div>
  <div id="childInfo" class="child hidden"></div>

  <div id="events" class="events"></div>

  <div class="row" id="saveRow" style="display:none">
    <button class="primary" id="saveAll">Guardar seleccionados en Google Calendar</button>
  </div>
  <div id="result" class="info hidden"></div>

  <div class="recent">
    <h2>Sincronizados recientemente</h2>
    <ul id="recentList"></ul>
  </div>

  <div class="row" style="justify-content:space-between;margin-top:10px">
    <a class="optlink" id="openOptions" href="#">⚙ Configurar (cuenta, calendario, sitio de esemtia, IA)</a>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>

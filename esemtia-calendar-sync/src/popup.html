<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>esemtia → Calendar</title>
<style>
  :root{ color-scheme: light dark; }
  *{box-sizing:border-box}
  body{margin:0;width:380px;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
    background:#fcfcfb;color:#0b0b0b}
  @media (prefers-color-scheme: dark){ body{background:#1a1a19;color:#fff} }
  .wrap{padding:14px}
  h1{font-size:14px;margin:0 0 10px}
  textarea{width:100%;min-height:80px;font:inherit;padding:8px;border-radius:8px;
    border:1px solid rgba(127,127,127,.35);background:transparent;color:inherit;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#77756f;flex:1;min-width:120px}
  input[type=text],input[type=date],input[type=time],select{
    font:inherit;padding:6px 8px;border-radius:7px;border:1px solid rgba(127,127,127,.35);
    background:transparent;color:inherit}
  label.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:#77756f}
  button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid rgba(127,127,127,.35);
    background:transparent;color:inherit;cursor:pointer}
  button.primary{background:#2a78d6;border-color:transparent;color:#fff;font-weight:600}
  button.primary:disabled{opacity:.5;cursor:default}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
    background:rgba(127,127,127,.15);margin-right:6px}
  .info{margin-top:10px;padding:9px 11px;border-radius:8px;background:rgba(127,127,127,.09);font-size:12px}
  .warn{border-left:3px solid #eda100}
  .ok{border-left:3px solid #1baf7a}
  .err{border-left:3px solid #d9534f}
  .recent{margin-top:14px;border-top:1px solid rgba(127,127,127,.25);padding-top:10px}
  .recent h2{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#77756f;margin:0 0 6px}
  .recent ul{list-style:none;padding:0;margin:0;max-height:120px;overflow:auto}
  .recent li{padding:4px 0;font-size:12px;display:flex;justify-content:space-between;gap:6px}
  .recent a{color:inherit}
  a.optlink{font-size:11px;color:#2a78d6;text-decoration:none}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 esemtia → Google Calendar</h1>

  <textarea id="text" placeholder="Pega aquí el texto del mensaje de esemtia Connect (o selecciónalo en la página y usa el botón flotante)."></textarea>

  <div id="detected" class="info hidden"></div>

  <div class="row">
    <label class="fld">Título
      <input type="text" id="title">
    </label>
  </div>
  <div class="row">
    <label class="fld">Fecha
      <input type="date" id="date">
    </label>
    <label class="fld" id="timeFld">Hora
      <input type="time" id="time">
    </label>
    <label class="chk"><input type="checkbox" id="allDay"> Todo el día</label>
  </div>
  <div class="row">
    <label class="fld">Calendario
      <select id="calendar"><option value="primary">Mi calendario principal</option></select>
    </label>
    <label class="fld">Recordarme
      <select id="reminder">
        <option value="60">1 hora antes</option>
        <option value="60,1440">1 hora y 1 día antes</option>
        <option value="1440">1 día antes</option>
        <option value="1440,2880">1 y 2 días antes</option>
        <option value="1440,2880,60">1 día, 2 días y 1 hora antes</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label class="fld">Repetir
      <select id="recurrence">
        <option value="">No se repite</option>
        <option value="RRULE:FREQ=DAILY">Cada día</option>
        <option value="RRULE:FREQ=WEEKLY">Cada semana</option>
        <option value="RRULE:FREQ=WEEKLY;INTERVAL=2">Cada 2 semanas</option>
        <option value="RRULE:FREQ=MONTHLY">Cada mes</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button class="primary" id="sync">Guardar en Google Calendar</button>
  </div>
  <div id="result" class="info hidden"></div>

  <div class="recent">
    <h2>Sincronizados recientemente</h2>
    <ul id="recentList"></ul>
  </div>

  <div class="row" style="justify-content:space-between;margin-top:10px">
    <a class="optlink" id="openOptions" href="#">⚙ Configurar (cuenta, calendario, sitio de esemtia)</a>
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
